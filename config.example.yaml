# Скопіюйте у config.yaml і відредагуйте:  cp config.example.yaml config.yaml
# config.yaml не потрапляє в git.

# Навчальний рік — входить у назву звіту
academic_year: "2026/2027"

# id таблиці звіту. Порожнє — скрипт створить таблицю і впише id сюди сам.
spreadsheet_id: ""

# Скільки робіт максимум обробляти за один запуск
max_submissions_per_run: 30

# Що записувати в чернетку оцінки в Classroom (етап 2):
#   national — оцінка за 5-бальною шкалою (2..5), рішення викладача від 04.10.2026
#   points   — бали зі 100
classroom_grade_scale: "national"

# Етап 1: true — лише звіт у Sheets, у Classroom нічого не записується.
dry_run: true

# Курси. course — назва курсу (як у Classroom), section — групи (необов'язково,
# допомагає розрізнити однакові назви). Можна вказати course_id напряму.
# rubric — файл рубрики в criteria/.
# assignments — назви завдань (як у Classroom) і вид роботи:
#   практична | семінарська | самостійна | реферат | презентація | доповідь | контрольна
# Порожній список assignments — нічого не перевіряти в цьому курсі.
courses:
  - course: "Трудове право"
    section: "31 юп-1, 31 юп-2"
    # course_id: "123456789"
    rubric: "criteria/трудове-право.md"
    assignments:
      - title: "Назва завдання з Classroom"
        work_type: "практична"
